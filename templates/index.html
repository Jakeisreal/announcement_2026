<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026년 화신그룹 정규직 전환 채용 최종 입사확인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        * { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        .hwashin-blue { background-color: #0d2b5c; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between">

    <header class="hwashin-blue text-white shadow-md">
        <div class="max-w-xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-building-circle-check text-xl text-blue-200"></i>
                <h1 class="text-base font-bold">화신그룹 정규직 전환 채용</h1>
            </div>
            <a href="/admin" class="text-xs text-blue-200 hover:text-white bg-white/10 px-2.5 py-1 rounded-lg">
                <i class="fa-solid fa-lock mr-1"></i> 관리자 대시보드
            </a>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-8 w-full">
        <div class="bg-white border border-slate-200/80 rounded-3xl p-6 sm:p-8 shadow-xl space-y-6">
            
            <div class="text-center space-y-2">
                <div class="w-16 h-16 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-2xl mx-auto">
                    <i class="fa-solid fa-user-check"></i>
                </div>
                <h2 class="text-xl font-black text-slate-900">최종 입사확인 본인 인증</h2>
                <p class="text-xs text-slate-500 leading-relaxed">
                    문자 또는 메일로 전달받으신 <strong>성명</strong>과 <strong>연락처(휴대폰 번호)</strong>를 입력해 주십시오.
                </p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">성명</label>
                    <input type="text" id="login-name" required placeholder="예: 홍길동"
                           class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">연락처 (휴대폰 번호)</label>
                    <input type="text" id="login-phone" required placeholder="예: 010-1234-5678 또는 뒷 4자리"
                           class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white">
                </div>

                <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-colors text-sm">
                    본인 확인 및 입장하기
                </button>
            </form>

            <div class="pt-4 border-t border-slate-100 text-center">
                <a href="https://dull-chip-592.notion.site/3db81225d75380f0bce9c116ca22486f?source=copy_link" target="_blank"
                   class="text-xs text-slate-500 hover:text-blue-600 flex items-center justify-center">
                    <i class="fa-solid fa-book-open mr-1.5"></i> 화신그룹 정규직 전환 안내 가이드 (Notion)
                </a>
            </div>

        </div>
    </main>

    <footer class="text-center text-xs text-slate-400 py-6">
        © 2026 HWASHIN CO., LTD. All rights reserved.
    </footer>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const name = document.getElementById('login-name').value.trim();
            const phone = document.getElementById('login-phone').value.trim().replace(/[^0-9]/g, '');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, phone: phone })
                });
                const result = await res.json();
                if (result.success && result.token) {
                    window.location.href = `/confirm/${result.token}`;
                } else {
                    alert(result.message || '입력하신 정보와 일치하는 대상자를 찾을 수 없습니다.');
                }
            } catch (err) {
                alert('통신 중 오류가 발생했습니다.');
            }
        }
    </script>
</body>
</html>
